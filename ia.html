<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaprioLibras IA — Módulo de Visão</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --glass-bg: rgba(255,255,255,0.08);
      --glass-border: rgba(255,255,255,0.18);
      --blur: blur(18px);
      --accent: #5ee7df;
      --accent2: #b490f5;
      --text-primary: rgba(255,255,255,0.95);
      --text-secondary: rgba(255,255,255,0.6);
      --radius: 20px;
    }
    body { background: #0a0a1a; color: var(--text-primary); font-family: 'Outfit', sans-serif; min-height: 100vh; overflow-x: hidden; }
    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4; }
    .orb-1 { width: 400px; height: 400px; background: #5ee7df; top: -100px; left: -100px; }
    .orb-2 { width: 400px; height: 400px; background: #b490f5; bottom: -100px; right: -100px; }
    
    .app { position: relative; z-index: 2; padding: 20px; display: flex; flex-direction: column; gap: 20px; max-width: 1400px; margin: 0 auto; }
    header { background: var(--glass-bg); backdrop-filter: var(--blur); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
    .logo-text strong { font-size: 20px; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .panel { background: var(--glass-bg); backdrop-filter: var(--blur); border: 1px solid var(--glass-border); border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; }
    .panel-header { padding: 15px; border-bottom: 1px solid var(--glass-border); font-weight: 600; font-size: 14px; color: var(--text-secondary); text-transform: uppercase; }
    
    .api-box { padding: 15px; background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--glass-border); }
    input[type="password"] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: white; outline: none; }
    
    .pdf-viewer { flex: 1; min-height: 600px; display: flex; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; }
    #pdfCanvas { max-width: 100%; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); cursor: pointer; display: none; }
    
    .text-area { flex: 1; padding: 20px; font-size: 18px; line-height: 1.6; white-space: pre-wrap; outline: none; overflow-y: auto; }
    
    .nav { padding: 15px; display: flex; gap: 10px; justify-content: center; background: rgba(0,0,0,0.2); }
    .btn { padding: 10px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; transition: 0.3s; }
    .btn-nav { background: rgba(255,255,255,0.1); color: white; }
    .btn-action { background: linear-gradient(135deg, var(--accent2), #818cf8); color: white; margin: 15px; padding: 15px; }
    
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a1a2e; border: 1px solid var(--accent); padding: 12px 25px; border-radius: 30px; opacity: 0; transition: 0.3s; z-index: 1000; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
<div class="bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
<div class="app">
  <header>
    <div class="logo-text"><strong>CaprioLibras IA</strong><span> • Módulo de Visão Computacional</span></div>
    <div style="font-size: 12px; color: var(--text-secondary)">Colégio Hercília Franca</div>
  </header>

  <div class="main">
    <div class="panel">
      <div class="panel-header">1. Visualização do PDF</div>
      <div style="padding: 15px;">
        <input type="file" id="fileInput" accept=".pdf" onchange="loadPDF()" style="font-size: 13px;">
      </div>
      <div class="pdf-viewer">
        <div id="placeholder">Arraste o PDF para começar</div>
        <canvas id="pdfCanvas"></canvas>
      </div>
      <div class="nav" id="navBar" style="display: none;">
        <button class="btn btn-nav" onclick="changePage(-1)">Anterior</button>
        <span id="pageInfo" style="margin-top: 8px;">1 / 1</span>
        <button class="btn btn-nav" onclick="changePage(1)">Próximo</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">2. Inteligência Artificial (Gemini)</div>
      <div class="api-box">
        <label style="font-size: 11px; margin-bottom: 5px; display: block;">CHAVE API GOOGLE:</label>
        <input type="password" id="apiKey" placeholder="Cole sua API Key aqui...">
      </div>
      <div class="text-area" id="extractedText" contenteditable="true">O texto organizado aparecerá aqui após você clicar no slide à esquerda...</div>
      <button class="btn btn-action" onclick="startLibras()">🤟 Traduzir para LIBRAS</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div vw class="enabled"><div vw-access-button class="active"></div><div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div></div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

<script>
  new window.VLibras.Widget('https://vlibras.gov.br/app');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  let pdfDoc = null, currPage = 1;

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  async function loadPDF() {
    const file = document.getElementById('fileInput').files[0];
    if (!file) return;
    const buf = await file.arrayBuffer();
    pdfDoc = await pdfjsLib.getDocument({data: buf}).promise;
    currPage = 1;
    document.getElementById('navBar').style.display = 'flex';
    renderPage(currPage);
    showToast("PDF carregado! Clique no slide para ler com IA.");
  }

  async function renderPage(num) {
    const page = await pdfDoc.getPage(num);
    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');
    const viewport = page.getViewport({scale: 2.0});
    canvas.height = viewport.height;
    canvas.width = viewport.width;
    await page.render({canvasContext: ctx, viewport: viewport}).promise;
    canvas.style.display = 'block';
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('pageInfo').innerText = `${num} / ${pdfDoc.numPages}`;
    canvas.onclick = callGemini;
  }

  function changePage(delta) {
    const next = currPage + delta;
    if (next >= 1 && next <= pdfDoc.numPages) {
      currPage = next;
      renderPage(currPage);
      document.getElementById('extractedText').innerText = "Clique no slide para extrair...";
    }
  }

  async function callGemini() {
    const key = document.getElementById('apiKey').value.trim();
    if (!key) return showToast("Por favor, cole a sua chave API!");
    
    const output = document.getElementById('extractedText');
    output.innerText = "🧠 IA analisando layout do slide... aguarde.";
    showToast("Enviando para o Google Gemini...");

    try {
      const canvas = document.getElementById('pdfCanvas');
      const imgData = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
      
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          contents: [{
            parts: [
              {text: "Aja como um especialista em acessibilidade. Transcreva o texto deste slide na ordem lógica e correta de leitura para um aluno surdo. Se houver colunas, leia a esquerda antes da direita. Retorne APENAS o texto."},
              {inlineData: {mimeType: "image/jpeg", data: imgData}}
            ]
          }]
        })
      });

      const data = await response.json();
      output.innerText = data.candidates[0].content.parts[0].text;
      showToast("Extração concluída!");
    } catch (e) {
      output.innerText = "Erro ao acessar a IA. Verifique sua chave ou internet.";
    }
  }

  function startLibras() {
    const text = document.getElementById('extractedText').innerText;
    const btn = document.querySelector('[vw-access-button]');
    if (btn) btn.click();
    showToast("Traduzindo...");
  }
</script>
</body>
</html>
